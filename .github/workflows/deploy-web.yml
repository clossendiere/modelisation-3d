name: Publier Solidcraft Web 3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Installer Trunk
        run: cargo install trunk --locked

      - name: Compiler Solidcraft Web
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url ./

      - name: Diagnostiquer la compilation
        run: |
          echo "=== Dossiers dist ==="
          find . -type d -name dist -print

          echo "=== Fichiers WebAssembly ==="
          find . -type f -name "*.wasm" -print

          echo "=== Contenu application Web ==="
          ls -lah apps/solidcraft-web/

          echo "=== Contenu du dossier dist ==="
          if [ -d dist ]; then
            ls -lah dist/
          else
            echo "ERREUR : dossier dist introuvable"
            exit 1
          fi

          echo "=== Recherche de index.html ==="
          find dist -name "index.html" -print

          if [ ! -f dist/index.html ]; then
            echo "ERREUR : dist/index.html introuvable"
            exit 1
          fi

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Preparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
