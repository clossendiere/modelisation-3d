name: Publier Solidcraft Web 3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Installer Trunk
        run: cargo install trunk --locked

      - name: Compiler Solidcraft Web
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url ./

      - name: Diagnostiquer la compilation
        run: |
          echo "=== Dossiers dist ==="
          find . -type d -name dist -print

          echo "=== Fichiers WebAssembly ==="
          find . -type f -name "*.wasm" -print

          echo "=== Contenu application Web ==="
          ls -lah apps/solidcraft-web/

          echo "=== Contenu du dossier dist/web ==="
          if [ -d dist/web ]; then
            ls -lah dist/web/
          else
            echo "ERREUR : dossier dist/web introuvable"
            exit 1
          fi

          echo "=== Verification de index.html ==="
          if [ -f dist/web/index.html ]; then
            echo "OK : dist/web/index.html trouve"
          else
            echo "ERREUR : dist/web/index.html introuvable"
            exit 1
          fi

          echo "=== Verification WebAssembly ==="
          if find dist/web -type f -name "*.wasm" | grep -q .; then
            echo "OK : fichier WebAssembly trouve"
          else
            echo "ERREUR : aucun fichier WebAssembly"
            exit 1
          fi

          echo "=== Compilation validee ==="

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Preparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

