name: Preparer mdBook

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Installer mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Construire mdBook
        run: mdbook build docs/book

      - name: Recuperer le dernier site Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=pages.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "Aucune execution Pages reussie."
            exit 1
          fi

          echo "Execution Pages : $RUN_ID"

          mkdir -p previous-site
          gh run download "$RUN_ID" \
            --name github-pages \
            --dir previous-site

      - name: Examiner l'archive Pages
        run: |
          echo "=== Archive Pages ==="
          ls -lh previous-site/artifact.tar

          echo "=== Extraire le site ==="
          mkdir -p extracted-site
          tar -xf previous-site/artifact.tar -C extracted-site

          echo "=== Contenu principal ==="
          ls -lah extracted-site/

          echo "=== Documentation mdBook ==="
          if [ -f extracted-site/index.html ]; then
            echo "OK : documentation presente"
          else
            echo "ATTENTION : index.html absent"
          fi

          echo "=== Application SolidCraft ==="
          if [ -f extracted-site/app/index.html ]; then
            echo "OK : application presente"
          else
            echo "ATTENTION : application absente"
          fi

          echo "=== Fichiers Flatpak ==="
          find extracted-site -maxdepth 4 \
            \( -name "*.flatpakref" \
            -o -name "*.flatpakrepo" \
            -o -name "summary" \) -print

          echo "=== Taille du site ==="
          du -sh extracted-site/

      - name: Rechercher les fichiers Flatpak
        run: |
          echo "=== Dossiers Flatpak et OSTree ==="
          find extracted-site -maxdepth 5 \
            \( -iname "*flatpak*" \
            -o -name "objects" \
            -o -name "refs" \
            -o -name "summary*" \) -print

          echo "=== Dossiers principaux ==="
          du -h --max-depth=2 extracted-site \
            | sort -h | tail -20
