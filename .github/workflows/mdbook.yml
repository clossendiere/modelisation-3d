name: Preparer mdBook

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Installer mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Construire mdBook
        run: mdbook build docs/book

      - name: Verifier la documentation
        run: |
          test -f target/book/index.html
          echo "Documentation mdBook construite."

      - name: Conserver la documentation
        uses: actions/upload-artifact@v4
        with:
          name: mdbook-html
          path: target/book/
          retention-days: 7
          if-no-files-found: error
