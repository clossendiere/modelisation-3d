name: Preparer mdBook

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Installer mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Construire mdBook
        run: mdbook build docs/book

      - name: Recuperer le dernier site Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=pages.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "Aucune execution Pages reussie."
            exit 1
          fi

          echo "Execution Pages : $RUN_ID"

          mkdir -p previous-site
          gh run download "$RUN_ID" \
            --name github-pages \
            --dir previous-site

      - name: Examiner l'archive Pages
        run: |
          echo "=== Fichiers telecharges ==="
          ls -lah previous-site/

          echo "=== Types de fichiers ==="
          file previous-site/*

          echo "=== Contenu de l'archive ==="
          find previous-site -maxdepth 2 -type f

      - name: Conserver le diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-pages
          path: previous-site/
          retention-days: 7
