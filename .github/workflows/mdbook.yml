name: Preparer mdBook

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4

      - name: Installer mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Construire mdBook
        run: |
          mdbook build docs/book
          test -f target/book/index.html

      - name: Recuperer le dernier site Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=pages.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "ERREUR : aucune execution Pages reussie"
            exit 1
          fi

          echo "Execution Pages : $RUN_ID"

          mkdir -p previous-site

          gh run download "$RUN_ID" \
            --name github-pages \
            --dir previous-site

      - name: Extraire le site existant
        run: |
          mkdir -p extracted-site

          tar -xf previous-site/artifact.tar \
            -C extracted-site

          test -f extracted-site/index.html
          test -f extracted-site/app/index.html

          echo "Site existant extrait avec succes"

      - name: Assembler le nouveau site
        run: |
          echo "=== Nouvelle documentation ==="

          mkdir -p site
          cp -a target/book/. site/

          echo "=== Preparation SEO ==="
          bash docs/book/seo.sh site

          echo "=== Recuperation de SolidCraft ==="
          cp -a extracted-site/app site/app

          echo "=== Configuration GitHub Pages ==="
          if [ -f extracted-site/.nojekyll ]; then
            cp -a extracted-site/.nojekyll site/
          else
            touch site/.nojekyll
          fi

          echo "=== Site assemble ==="
          ls -lah site/

      - name: Verifier le nouveau site
        run: |
          echo "=== Documentation ==="
          test -f site/index.html
          echo "OK : documentation presente"

          echo "=== Application ==="
          test -f site/app/index.html
          echo "OK : application presente"

          echo "=== WebAssembly ==="
          WASM=$(find site/app -type f \
            -name "*.wasm" -print -quit)

          if [ -z "$WASM" ]; then
            echo "ERREUR : WebAssembly introuvable"
            exit 1
          fi

          echo "OK : $WASM"

          echo "=== GitHub Pages ==="
          test -f site/.nojekyll
          echo "OK : .nojekyll present"

          echo "=== Tailles ==="
          du -sh site/
          du -sh site/app/

          echo "=== Verification terminee ==="

      - name: Comparer ancien et nouveau site
        run: |
          echo "=== Fichiers absents du nouveau site ==="

          find extracted-site -type f \
            | sed 's#^extracted-site/##' \
            | sort > /tmp/ancien.txt

          find site -type f \
            | sed 's#^site/##' \
            | sort > /tmp/nouveau.txt

          comm -23 /tmp/ancien.txt /tmp/nouveau.txt \
            > /tmp/fichiers-absents.txt

          echo "=== Nombre de fichiers absents ==="
          wc -l /tmp/fichiers-absents.txt

          echo "=== Liste des fichiers absents ==="
          cat /tmp/fichiers-absents.txt

          echo "=== Fichiers ajoutes ==="
          comm -13 /tmp/ancien.txt /tmp/nouveau.txt

          echo "=== Verification de l'application ==="
          diff -qr extracted-site/app site/app \
            && echo "OK : application identique"

          echo "=== Tailles ==="
          du -sh extracted-site site

      - name: Conserver le site pour verification
        uses: actions/upload-artifact@v4
        with:
          name: site-mdbook-test
          path: site/
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error
