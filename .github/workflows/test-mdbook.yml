
name: Test mdBook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mdbook:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Construire la documentation
        run: mdbook build docs/book

      - name: Conserver le resultat
        uses: actions/upload-artifact@v4
        with:
          name: documentation-mdbook
          path: target/book/
